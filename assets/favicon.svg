<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Graphite Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141928" />
      <stop offset="55%" stop-color="#0B0E18" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Metallic Rose Gold Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="45%" stop-color="#FB7185" />
      <stop offset="85%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Titanium White Gradient for Letter T -->
    <linearGradient id="whiteStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Radiant Rose Gold to Coral Gradient for Letter N -->
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="45%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FB7185" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for 3D Icon Depth -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FB7185" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Rim -->
  <rect x="22" y="22" width="468" height="468" rx="122" ry="122" 
        fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="20" 
        filter="url(#shadowFilter)" />

  <!-- Center Ambient Radial Glow -->
  <rect x="22" y="22" width="468" height="468" rx="122" ry="122" 
        fill="url(#centerGlow)" />

  <!-- UNIFIED T & N COMBINATION MONOGRAM -->
  <!-- N Diagonal Slash: bursting in radiant Rose Gold -->
  <path d="M 214 160 L 384 360" 
        stroke="url(#roseAccent)" stroke-width="48" stroke-linecap="round" />

  <!-- N Right Vertical Stem: rising in radiant Rose Gold -->
  <path d="M 384 360 L 384 160" 
        stroke="url(#roseAccent)" stroke-width="48" stroke-linecap="round" />

  <!-- N Telemetry Node: crowning the right stem -->
  <circle cx="384" cy="160" r="14" fill="#FDA4AF" />

  <!-- T Horizontal Crossbar: in crisp Titanium White, centered over the stem -->
  <path d="M 128 160 L 300 160" 
        stroke="url(#whiteStem)" stroke-width="48" stroke-linecap="round" />

  <!-- T Vertical Stem / Shared N Left Stem: in crisp Titanium White -->
  <path d="M 214 160 L 214 360" 
        stroke="url(#whiteStem)" stroke-width="48" stroke-linecap="round" />
</svg>
