<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141928" />
      <stop offset="60%" stop-color="#0B0E18" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Metallic Rose Gold Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="45%" stop-color="#FB7185" />
      <stop offset="85%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Titanium White Stem Gradient -->
    <linearGradient id="whiteStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Rose Quartz to Coral Accent Gradient -->
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="45%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Radial Glow in Center -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FB7185" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Icon Depth -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FB7185" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="22" y="22" width="468" height="468" rx="122" ry="122" 
        fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="20" 
        filter="url(#shadowFilter)" />

  <!-- Center Ambient Radial Glow -->
  <rect x="22" y="22" width="468" height="468" rx="122" ry="122" 
        fill="url(#centerGlow)" />

  <!-- DevOps Cloud Infrastructure Arch -->
  <path d="M 146 166 C 158 132, 204 122, 236 146 C 262 114, 326 114, 352 146 C 376 140, 398 160, 394 182" 
        fill="none" stroke="url(#roseAccent)" stroke-width="14" stroke-linecap="round" opacity="0.9" />

  <!-- Cloud Telemetry Node -->
  <circle cx="394" cy="182" r="11" fill="#FDA4AF" />

  <!-- Monogram "T" -->
  <!-- T Crossbar -->
  <path d="M 108 205 L 248 205" 
        stroke="url(#whiteStem)" stroke-width="44" stroke-linecap="round" />
  <!-- T Stem -->
  <path d="M 178 205 L 178 385" 
        stroke="url(#whiteStem)" stroke-width="44" stroke-linecap="round" />

  <!-- Monogram "N" -->
  <!-- N Left Stem -->
  <path d="M 276 385 L 276 205" 
        stroke="url(#whiteStem)" stroke-width="44" stroke-linecap="round" />
  <!-- N Diagonal Accent -->
  <path d="M 276 205 L 404 385" 
        stroke="url(#roseAccent)" stroke-width="44" stroke-linecap="round" />
  <!-- N Right Stem -->
  <path d="M 404 385 L 404 205" 
        stroke="url(#roseAccent)" stroke-width="44" stroke-linecap="round" />
</svg>
